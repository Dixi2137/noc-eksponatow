<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Galeria broni</title>
<style>body{margin:0;background:#10120f;color:#eee;font:12px system-ui}.row{display:flex;flex-wrap:wrap;gap:8px;padding:12px}figure{margin:0;text-align:center}canvas{background:#1a2020;border:1px solid #333}figcaption{font-size:10px;color:#aaa;margin-top:2px}</style></head>
<body><div class="row" id="row"></div>
<script src="../dist/knights.js"></script><script src="../dist/perks.js"></script><script src="../dist/weapons.js"></script><script src="../dist/finishes.js"></script><script src="../dist/exhibits.js"></script><script src="../dist/twists.js"></script><script src="../dist/levels.js"></script><script src="../dist/cards.js"></script><script src="../dist/hall.js"></script><script src="../dist/art.js"></script>
<script>for(const w of window.MuseumWeapons.all()){const f=document.createElement('figure'),c=document.createElement('canvas');c.width=180;c.height=180;const x=c.getContext('2d');x.save();x.translate(90,95);x.scale(.55,.55);window.MuseumArt.drawWeaponIcon(x,w);x.restore();f.append(c);const cap=document.createElement('figcaption');cap.textContent=w.name+' · '+w.typeName;f.append(cap);row.append(f);}</script></body></html>
